[package]
name = "rclippy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Simple encrypted LAN/VPN text clipboard sharing."
repository = "https://github.com/Invades/rclippy"

[package.metadata.packager]
product-name = "rclippy"
identifier = "eu.invades.rclippy"
category = "Utility"
icons = ["target/package-icons/*.png"]

[[package.metadata.packager.binaries]]
path = "rclippy"
main = true

[package.metadata.packager.macos]
background-app = true

[package.metadata.packager.dmg]
window-size = { width = 600, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.appimage]
excluded-libraries = [
    "libappindicator3*",
    "libayatana-appindicator3*",
    "libayatana-ido3*",
    "libgio-2.0*",
    "libglib-2.0*",
    "libgmodule-2.0*",
    "libgobject-2.0*",
    "libgthread-2.0*",
    "libmount*",
    "libblkid*",
    "libuuid*",
    "libEGL*",
    "libGL*",
    "libGLES*",
    "libgbm*",
    "libdrm*",
    "libwayland*",
    "libx11*",
    "libX11*",
    "libxcb*",
]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
auto-launch = "0.6"
base64 = "0.22"
directories = "6"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "wgpu", "x11"] }
fontdb = "0.23"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
hostname = "0.4"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"
rcgen = { version = "0.14", features = ["crypto"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging"] }
rustls-pki-types = "1.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "0.9"
tray-icon = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
resvg = "0.45"
tiny-skia = "0.11"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
winit = { git = "https://github.com/Invades/winit", branch = "win32-taskbar-created-0.30" }
