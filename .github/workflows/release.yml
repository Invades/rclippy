name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: validate-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libatk1.0-dev \
            libayatana-appindicator3-dev \
            libcairo2-dev \
            libfuse2 \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libx11-dev \
            libxdo-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            patchelf
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  package:
    name: build-release-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            format: appimage

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-packager
        if: runner.os != 'Windows'
        run: cargo install cargo-packager --locked

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libatk1.0-dev \
            libayatana-appindicator3-dev \
            libcairo2-dev \
            libfuse2 \
            libgdk-pixbuf-2.0-dev \
            libgtk-3-dev \
            libpango1.0-dev \
            librsvg2-dev \
            libx11-dev \
            libxdo-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            patchelf

      - name: Build release
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build macOS universal release
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            -output target/universal-apple-darwin/release/rclippy \
            target/x86_64-apple-darwin/release/rclippy \
            target/aarch64-apple-darwin/release/rclippy
          lipo -info target/universal-apple-darwin/release/rclippy

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --bin rclippy-uninstaller
          $env:RCLIPPY_INSTALLER_PAYLOAD = (Resolve-Path target/release/rclippy.exe).Path
          $env:RCLIPPY_UNINSTALLER_PAYLOAD = (Resolve-Path target/release/rclippy-uninstaller.exe).Path
          cargo build --release --bin rclippy-installer
          New-Item -ItemType Directory -Force dist/${{ matrix.name }}
          Copy-Item target/release/rclippy-installer.exe dist/${{ matrix.name }}/rclippy-windows-x64-installer.exe

      - name: Package macOS
        if: runner.os == 'macOS'
        run: cargo packager --release --target universal-apple-darwin --formats ${{ matrix.format }} --out-dir dist/${{ matrix.name }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo packager --release --formats ${{ matrix.format }} --out-dir dist/${{ matrix.name }}
          appimage="$(find dist/${{ matrix.name }} -maxdepth 1 -name '*.AppImage' -print -quit)"
          mv "$appimage" dist/${{ matrix.name }}/rclippy-linux-x64.AppImage
          cp scripts/install-linux.sh dist/${{ matrix.name }}/rclippy-linux-install.sh
          chmod +x dist/${{ matrix.name }}/rclippy-linux-install.sh
          (cd dist/${{ matrix.name }} && zip rclippy-linux-x64.zip rclippy-linux-x64.AppImage rclippy-linux-install.sh)

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: rclippy-${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}/*.dmg
            dist/${{ matrix.name }}/*.exe
            dist/${{ matrix.name }}/*.zip
          if-no-files-found: error

  release:
    name: publish-github-release
    runs-on: ubuntu-22.04
    needs: package

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Resolve release version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        run: |
          previous_tag="$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          if [ -z "$previous_tag" ]; then
            previous_tag="dev"
          fi
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
          echo "[Full changelog](${compare_url})" > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: dist/*
