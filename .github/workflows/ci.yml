name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: macos-latest
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Build macOS universal release
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p dist/package
          lipo -create \
            -output dist/package/rclippy \
            target/x86_64-apple-darwin/release/rclippy \
            target/aarch64-apple-darwin/release/rclippy
          lipo -info dist/package/rclippy

      - name: Package macOS artifact
        run: tar -czf "dist/rclippy-macos-universal.tar.gz" -C dist/package rclippy

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: rclippy-macos-universal
          path: dist/rclippy-macos-universal.tar.gz
          if-no-files-found: error
