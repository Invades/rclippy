name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rclippy-windows-x64
          - os: macos-latest
            artifact: rclippy-macos
          - os: ubuntu-latest
            artifact: rclippy-linux-x64

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item target\release\rclippy.exe dist\rclippy.exe
          Compress-Archive -Path dist\rclippy.exe -DestinationPath dist\${{ matrix.artifact }}.zip -Force

      - name: Package macOS/Linux artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/package
          cp target/release/rclippy dist/package/rclippy
          tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist/package rclippy

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
