<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Transparent vector Clippy with sync loop behind</title>
  <desc id="desc">A transparent-background vector paperclip assistant with a full two-arrow circular loop behind it.</desc>
  <defs>
    <linearGradient id="clipTube" x1="166" y1="46" x2="334" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0dcff"/>
      <stop offset="0.34" stop-color="#8782c7"/>
      <stop offset="0.62" stop-color="#56527f"/>
      <stop offset="1" stop-color="#b9b5ee"/>
    </linearGradient>
    <radialGradient id="eyeWhite" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.68" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#d6d9e8"/>
    </radialGradient>
    <radialGradient id="pupil" cx="38%" cy="34%" r="68%">
      <stop offset="0" stop-color="#3f3f41"/>
      <stop offset="0.58" stop-color="#111113"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#101827" flood-opacity="0.2"/>
    </filter>
    <filter id="eyeShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#101827" flood-opacity="0.28"/>
    </filter>
