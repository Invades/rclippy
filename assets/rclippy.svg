    <g stroke="url(#clipTube)" stroke-width="20">
      <path d="M 351.6507 209.3394 C 324.2997 231.3836 325.9099 249.4371 319.2124 283.2773 L 309.531 335.6376 C 296.2638 390.7923 297.8131 423.5157 259.3903 431.7652 C 220.9675 440.0147 174 404 174 326 C 174 286 174 254 176 226 C 181 138 214 82 274 79 C 299 79 299.8062 95.6012 299.5734 135.8516 C 299.3026 182.675 290.9042 219.9604 285.936 259.3711 C 281.4993 290.6491 282.0412 310.4668 271.2815 331.1585 C 260.5218 351.8502 238.3595 359.0344 223.7842 344.8026 C 209.2089 330.5708 207.9068 280.2289 215.648 234.368"/>
